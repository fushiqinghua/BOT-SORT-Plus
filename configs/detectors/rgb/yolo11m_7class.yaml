# YOLO11-m RGB 单模态检测器
# 数据集：VT-Tiny-MOT；类别索引与 data.yaml 保持一致。
# 0 ship | 1 car | 2 cyclist | 3 pedestrian | 4 bus | 5 drone | 6 plane
# 层格式：[from, repeats, module, args, 可选输入槽位]；右侧编号是全局层索引。
# from=-1 表示上一层；列表表示多路输入；repeats/通道数会按 scale 缩放。
# P3/8、P4/16、P5/32 分别表示相对输入图像的步长。

nc: 7
scale: "m"

# 模型缩放系数：[depth, width, max_channels]
scales:
  n: [0.5, 0.25, 1024]
  s: [0.5, 0.5, 1024]
  m: [0.5, 1.0, 512]
  l: [1.0, 1.0, 512]
  x: [1.0, 1.5, 512]

backbone:
  # ── RGB backbone ──
  - [-1, 1, Conv, [64, 3, 2]]                                    # 00 | RGB P1/2：下采样
  - [-1, 1, Conv, [128, 3, 2]]                                   # 01 | RGB P2/4：下采样
  - [-1, 2, C3k2, [256, false, 0.25]]                            # 02 | RGB P2/4：特征提取
  - [-1, 1, Conv, [256, 3, 2]]                                   # 03 | RGB P3/8：下采样
  - [-1, 2, C3k2, [512, false, 0.25]]                            # 04 | RGB P3/8：侧向特征
  - [-1, 1, Conv, [512, 3, 2]]                                   # 05 | RGB P4/16：下采样
  - [-1, 2, C3k2, [512, true]]                                   # 06 | RGB P4/16：侧向特征
  - [-1, 1, Conv, [1024, 3, 2]]                                  # 07 | RGB P5/32：下采样
  - [-1, 2, C3k2, [1024, true]]                                  # 08 | RGB P5/32：特征提取
  - [-1, 1, SPPF, [1024, 5]]                                     # 09 | RGB P5/32：空间金字塔池化
  - [-1, 2, C2PSA, [1024]]                                       # 10 | RGB P5/32：注意力增强

head:
  # ── FPN：自顶向下传递语义信息 ──
  - [-1, 1, nn.Upsample, [None, 2, nearest]]                     # 11 | P5 → P4：上采样
  - [[-1, 6], 1, Concat, [1]]                                    # 12 | 拼接 P4 侧向特征
  - [-1, 2, C3k2, [512, false]]                                  # 13 | FPN P4/16
  - [-1, 1, nn.Upsample, [None, 2, nearest]]                     # 14 | P4 → P3：上采样
  - [[-1, 4], 1, Concat, [1]]                                    # 15 | 拼接 RGB 原生 P3[4]
  - [-1, 2, C3k2, [256, false]]                                  # 16 | 检测特征 P3/8

  # ── PAN：自底向上聚合定位特征 ──
  - [-1, 1, Conv, [256, 3, 2]]                                   # 17 | P3 → P4：下采样
  - [[-1, 13], 1, Concat, [1]]                                   # 18 | 拼接 FPN P4
  - [-1, 2, C3k2, [512, false]]                                  # 19 | 检测特征 P4/16
  - [-1, 1, Conv, [512, 3, 2]]                                   # 20 | P4 → P5：下采样
  - [[-1, 10], 1, Concat, [1]]                                   # 21 | 拼接 P5 侧向特征
  - [-1, 2, C3k2, [1024, true]]                                  # 22 | 检测特征 P5/32

  # ── 保留 P3/P4/P5 三尺度检测头 ──
  - [[16, 19, 22], 1, Detect, [nc]]                              # 23 | 三尺度检测输出：P3/8、P4/16、P5/32
